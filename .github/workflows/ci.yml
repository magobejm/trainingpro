name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @trainerpro/api db:generate
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r build

  db-migrations:
    name: Prisma migrate deploy + status
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trainerpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trainerpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trainerpro_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/trainerpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @trainerpro/api db:generate
      - run: pnpm --filter @trainerpro/api db:migrate:deploy
      - run: pnpm --filter @trainerpro/api db:migrate:status

  api-docker:
    name: Docker build + /health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: trainerpro-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and probe /health
        run: |
          docker run -d --name api -p 8080:8080 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://stub:stub@localhost:5432/stub \
            -e DIRECT_URL=postgresql://stub:stub@localhost:5432/stub \
            trainerpro-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then
              echo "OK"; exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

  ci-ok:
    name: CI green
    runs-on: ubuntu-latest
    needs: [quality, db-migrations, api-docker]
    steps:
      - run: echo "All required checks passed"
