name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  GCP_REGION: europe-southwest1
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  AR_REPO: api-images
  CLOUD_RUN_SERVICE: api
  FIREBASE_SITE: ${{ vars.FIREBASE_SITE }}

jobs:
  deploy-db:
    name: Apply Prisma migrations to Supabase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read DIRECT_URL from Secret Manager
        run: |
          echo "DIRECT_URL=$(gcloud secrets versions access latest --secret=DIRECT_URL --project=${GCP_PROJECT_ID})" >> $GITHUB_ENV
      - name: Prisma migrate status
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
        run: pnpm --filter @trainerpro/api db:migrate:status
        continue-on-error: true
      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DIRECT_URL }}
        run: pnpm --filter @trainerpro/api db:migrate:deploy

  deploy-api:
    name: Build + push image, deploy Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-db
    permissions:
      contents: read
      id-token: write
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure docker auth
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --concurrency=40
            --timeout=60
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            DIRECT_URL=DIRECT_URL:latest
            SUPABASE_URL=SUPABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
            SUPABASE_STORAGE_BUCKET=SUPABASE_STORAGE_BUCKET:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
          env_vars: |
            NODE_ENV=production
            CORS_ORIGINS=https://${{ vars.FIREBASE_SITE }}.web.app,https://${{ vars.FIREBASE_SITE }}.firebaseapp.com
            PUBLIC_ASSET_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Smoke test /health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ steps.deploy.outputs.url }}/health"; then
              echo "OK"; exit 0
            fi
            sleep 3
          done
          exit 1

  deploy-web:
    name: Build + deploy web to Firebase Hosting
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Build web
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || needs.deploy-api.outputs.service_url }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @trainerpro/web build
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.GCP_PROJECT_ID }}
          target: ${{ env.FIREBASE_SITE }}
          channelId: live
