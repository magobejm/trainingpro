<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="notranslate" name="google" />
    <title>FitCoach Web</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* react-native-web fija "font: 14px System" en cada Text/TextInput; esto aplica Inter a toda la app.
         Los textos que necesiten otra tipografía (p. ej. monoespaciada) llevan data-font="mono". */
      #root :where(div, span, input, textarea, button, select, a):not([data-font='mono']) {
        font-family: inherit;
      }
      /* Foco visible al navegar con teclado (también dentro de ventanas, que viven fuera de #root). */
      body *:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      body [role='dialog']:focus-visible {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
