# NOTA: este Postgres NO es para desarrollo local — para dev usa Supabase CLI
# (pnpm dlx supabase start). Este servicio existe SOLO para que el job
# `db-migrations` del CI valide que las migraciones aplican desde cero en cada PR.
services:
  postgres:
    image: postgres:16-alpine
    container_name: trainerpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trainerpro_dev
    ports:
      - '5432:5432'
    volumes:
      - trainerpro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trainerpro_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['deploy']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trainerpro-api
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/trainerpro_dev?sslmode=disable}
      DIRECT_URL: ${DOCKER_DIRECT_URL:-postgresql://postgres:postgres@host.docker.internal:5432/trainerpro_dev?sslmode=disable}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-8080}
    ports:
      - '8080:8080'

volumes:
  trainerpro-postgres-data:
